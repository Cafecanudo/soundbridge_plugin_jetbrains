name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Versão a partir da tag
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build do plugin
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin -PpluginVersion="$PLUGIN_VERSION" --no-daemon

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoundBridge Plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: "true"
          files: build/distributions/*.zip
          body: |
            ### Instalação
            Baixe o **`soundbridge-plugin-${{ env.PLUGIN_VERSION }}.zip`** em **Assets** e instale na IDE:
            **Settings → Plugins → ⚙ → Install Plugin from Disk…** → selecione o `.zip`.

            **Requer** Python 3.10+ e o pacote:
            ```
            pip install soundbridge-tx[live]
            ```

            _Os "Source code (zip/tar.gz)" são anexados automaticamente pelo GitHub — para usar o plugin,
            baixe o `.zip` acima._
