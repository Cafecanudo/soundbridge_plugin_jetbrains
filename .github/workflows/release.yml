name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Versão a partir da tag
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build do plugin
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin -PpluginVersion="$PLUGIN_VERSION" --no-daemon

      - name: Criar a Release
        uses: softprops/action-gh-release@v2
        with:
          name: SoundBridge Plugin ${{ github.ref_name }}
          files: build/distributions/*.zip
          generate_release_notes: true
